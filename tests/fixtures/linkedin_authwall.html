<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign In | LinkedIn</title>
</head>
<body>
  <div class="authwall-join-form">
    <h1>Sign in to view full job posting details</h1>
    <form action="/uas/login-submit" method="post">
      <input type="text" name="session_key" placeholder="Email or Phone">
      <input type="password" name="session_password" placeholder="Password">
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
